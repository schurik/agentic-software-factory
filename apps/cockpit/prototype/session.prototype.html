<!doctype html>
<!--
  PROTOTYPE, throwaway. It answers one question for the wayfinder ticket
  "The session view: what the cockpit shows for one run" (#33).

  This is the chosen shape, variant D ("story + tabs"), polished:
    - a sidebar with the session's facts, and an outline or the journal
    - the story in chapters (one per workflow), each opening with what was asked
    - agent phases as cards, code steps as compact rows, gates as their own cards
    - "details" on a phase opens tabs: artifacts, overview, checks, tools, transcript, cost, events

  The data is shaped after a real, complete session (issue → pr-review ×2); the text is invented.
  It is built only from domain events, the #27 catalogue plus this ticket's additions:
  workflow_started/finished, artifact_written, committed, tool_called, session_resumed,
  phase_replayed, and phase_started.task/prompt_digest.

  The dev bar switches ?s=live|gate|failed|ci|done and ?t=0|1 (transcripts opted in).
  Data is fake and in memory. Commands print what they WOULD send.
  To open it: `open apps/cockpit/prototype/session.prototype.html`
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0b0d10; --surface:#12151a; --surface-2:#181c22; --surface-3:#1f242c; --border:#252b34; --border-2:#303743;
    --text:#e7e9ee; --text-2:#aab1bd; --muted:#747d8c;
    --accent:#7aa2ff; --accent-bg:#7aa2ff1a; --green:#3fb970; --green-bg:#3fb9701a; --red:#f2645a; --red-bg:#f2645a1a;
    --amber:#e3a33b; --amber-bg:#e3a33b1a; --violet:#b69cff; --violet-bg:#b69cff1a;
    --radius:10px; --mono:"JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing:border-box }
  html, body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased }
  a { color:var(--accent); text-decoration:none } a:hover { text-decoration:underline }
  code, .mono { font-family:var(--mono); font-size:12.5px }
  button { font:inherit; color:inherit; cursor:pointer }
  ::selection { background:#7aa2ff44 }

  /* ── top bar ── */
  .top { position:sticky; top:0; z-index:5; background:#0b0d10e6; backdrop-filter:blur(8px); border-bottom:1px solid var(--border) }
  .top-in { max-width:1320px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:16px }
  .crumbs { font-size:12.5px; color:var(--muted) } .crumbs b { color:var(--text-2); font-weight:500 }
  .top h1 { font-size:17px; font-weight:600; margin:2px 0 0; letter-spacing:-.01em }
  .top .grow { flex:1; min-width:0 }
  .actions { display:flex; align-items:center; gap:12px }
  .actions .why { font-size:12px; color:var(--muted); max-width:300px; text-align:right }
  .btn { border:1px solid var(--border-2); background:var(--surface-2); padding:7px 14px; border-radius:8px; font-weight:500 }
  .btn:hover { background:var(--surface-3) } .btn:disabled { opacity:.4; cursor:not-allowed }
  .btn.primary { background:var(--accent); color:#0b0d10; border-color:transparent } .btn.danger { color:var(--red); border-color:#f2645a55 }

  .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:500; white-space:nowrap }
  .pill.ok { background:var(--green-bg); color:var(--green) } .pill.bad { background:var(--red-bg); color:var(--red) }
  .pill.warn { background:var(--amber-bg); color:var(--amber) } .pill.run { background:var(--accent-bg); color:var(--accent) }
  .pill.neutral { background:var(--surface-3); color:var(--text-2) }
  .dot { width:7px; height:7px; border-radius:50%; background:currentColor; display:inline-block }
  .pulse { animation:pulse 1.4s infinite } @keyframes pulse { 50% { opacity:.25 } }

  /* ── layout ── */
  .layout { max-width:1320px; margin:0 auto; padding:24px; display:grid; grid-template-columns:290px minmax(0,1fr); gap:28px; align-items:start }
  aside { position:sticky; top:88px; display:flex; flex-direction:column; gap:16px; max-height:calc(100vh - 110px); overflow:auto; padding-bottom:40px }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius) }
  .facts { padding:6px 0 }
  .fact { display:grid; grid-template-columns:86px 1fr; gap:8px; padding:6px 16px; font-size:13px }
  .fact dt { color:var(--muted) } .fact dd { margin:0; color:var(--text-2); overflow:hidden; text-overflow:ellipsis }
  .fact dd b { color:var(--text); font-weight:500 }
  .seg { display:flex; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:3px }
  .seg button { flex:1; border:none; background:none; padding:6px; border-radius:6px; color:var(--muted); font-size:13px; font-weight:500 }
  .seg button.on { background:var(--surface-3); color:var(--text) }
  .outline { padding:8px 6px }
  .outline .oc { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); padding:10px 10px 4px }
  .outline a { display:flex; align-items:center; gap:8px; padding:4px 10px; border-radius:6px; color:var(--text-2); font-size:13px }
  .outline a:hover { background:var(--surface-2); text-decoration:none } .outline a .d { margin-left:auto; color:var(--muted); font-size:12px }
  .outline a.sub { color:var(--muted); font-size:12.5px }
  .journal { padding:14px 16px; font-size:12.5px; color:var(--text-2) }
  .journal .jc { color:var(--text); font-weight:600; margin:10px 0 4px } .journal .jc:first-child { margin-top:0 }
  .journal .jr { display:flex; gap:8px; padding:2px 0 } .journal .jr .mono { color:var(--muted) }
  .journal .jn { padding:3px 0 3px 18px; color:var(--text-2) }
  .journal .hint { color:var(--muted); font-size:12px; border-top:1px solid var(--border); margin-top:12px; padding-top:10px }

  /* ── now banner ── */
  .now { padding:18px 20px; display:flex; gap:16px; align-items:center; margin-bottom:8px; border-left:3px solid var(--muted) }
  .now.ok { border-left-color:var(--green) } .now.bad { border-left-color:var(--red) } .now.warn { border-left-color:var(--amber) } .now.run { border-left-color:var(--accent) }
  .now .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted) }
  .now .big { font-size:16px; font-weight:500; margin-top:2px } .now .grow { flex:1 }
  .stats { display:flex; gap:22px } .stat .v { font-size:16px; font-weight:600 } .stat .k { font-size:11.5px; color:var(--muted) }

  /* ── chapters ── */
  .chapter { margin-top:34px }
  .ch-head { display:flex; align-items:baseline; gap:12px; margin:0 0 14px }
  .ch-no { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted) }
  .ch-head h2 { margin:0; font-size:18px; font-weight:600; letter-spacing:-.01em }
  .ch-head .sub { color:var(--muted); font-size:13px } .ch-head .grow { flex:1 } .ch-head .cost { color:var(--text-2); font-size:13px }
  .asked { padding:14px 16px; border-left:3px solid var(--accent); margin-bottom:18px }
  .asked .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); display:flex; gap:10px; align-items:center }
  .asked .lbl .mono { color:var(--muted); text-transform:none; letter-spacing:0 }
  .asked .toggle { margin-left:auto; border:none; background:none; color:var(--text-2); font-size:12.5px }

  /* ── timeline ── */
  .tl { position:relative; margin-left:6px }
  .tl::before { content:""; position:absolute; left:52px; top:6px; bottom:6px; width:1px; background:var(--border) }
  .row { display:grid; grid-template-columns:44px 18px minmax(0,1fr); gap:0 12px; align-items:start; position:relative; margin-bottom:10px }
  .row .tm { font-family:var(--mono); font-size:11.5px; color:var(--muted); text-align:right; padding-top:14px }
  .row .node { width:13px; height:13px; border-radius:50%; margin:15px 0 0 2.5px; background:var(--bg); border:2px solid var(--muted); z-index:1 }
  .row.ok .node { border-color:var(--green) } .row.failed .node { border-color:var(--red); background:var(--red) }
  .row.running .node { border-color:var(--accent); background:var(--accent); animation:pulse 1.4s infinite }
  .row.waiting .node { border-color:var(--amber); background:var(--amber) }
  .row.compact .tm { padding-top:6px } .row.compact .node { width:9px; height:9px; margin:9px 0 0 4.5px; border-width:2px }
  .row.compact { margin-bottom:4px }

  .ph { padding:12px 16px }
  .ph.sel { border-color:var(--border-2) }
  .ph-head { display:flex; align-items:center; gap:10px; cursor:pointer }
  .ph-name { font-weight:600; font-size:14.5px }
  .kind { font-size:12px; color:var(--muted) } .kind .mono { color:var(--text-2); font-size:11.5px }
  .ph-head .grow { flex:1 }
  .meta { display:flex; gap:14px; font-size:12.5px; color:var(--muted); white-space:nowrap }
  .chev { color:var(--muted); transition:transform .15s; font-size:12px } .open .chev { transform:rotate(90deg) }
  .ph-sum { color:var(--text-2); margin-top:6px; font-size:13.5px } .ph-sum b { color:var(--text); font-weight:500 }
  .files { color:var(--muted); font-family:var(--mono); font-size:11.5px; margin-top:4px }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px }
  .chip { display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:3px 9px; font-size:12px; color:var(--text-2) }
  .chip:hover { border-color:var(--border-2); color:var(--text); text-decoration:none } .chip .k { color:var(--muted); font-size:11px }
  .note { display:flex; gap:8px; margin-top:8px; padding:7px 10px; border-radius:6px; font-size:13px; background:var(--violet-bg); color:var(--text-2) }
  .note .t { color:var(--violet); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em; padding-top:2px; white-space:nowrap }
  .fold { margin-top:8px; font-size:12px; color:var(--muted) }

  .step { display:flex; align-items:center; gap:10px; padding:4px 2px; font-size:13px; color:var(--text-2); min-height:26px }
  .step .n { color:var(--text); font-weight:500 } .step .grow { flex:1 } .step .d { color:var(--muted); font-size:12px }
  .step .ok { color:var(--green) } .step .bad { color:var(--red) }
  .step a.more { color:var(--muted); font-size:12px }
  .step-fail { margin:4px 0 6px }

  .gate { padding:12px 16px; border-left:3px solid var(--amber) }
  .gate.ok { border-left-color:var(--green) } .gate.bad { border-left-color:var(--red) }
  .gate h3 { margin:0; font-size:14px; font-weight:600; display:flex; gap:10px; align-items:center }
  .gate .ln { font-size:13px; color:var(--text-2); margin-top:6px } .gate .ln .mono { color:var(--text) }
  .remark { margin-top:8px; padding:7px 10px; border-radius:6px; background:var(--amber-bg); color:var(--text); font-size:13px }
  .remark .t { color:var(--amber); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em; margin-right:6px }
  .divider { display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--muted); padding:4px 0 }
  .divider b { color:var(--text-2); font-weight:500 }

  /* ── details (tabs) ── */
  .detail { margin-top:12px; border-top:1px solid var(--border); padding-top:12px }
  .tabs { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:12px }
  .tabs button { border:1px solid transparent; background:none; padding:5px 11px; border-radius:6px; color:var(--muted); font-size:12.5px; font-weight:500 }
  .tabs button:hover { color:var(--text-2) } .tabs button.on { background:var(--surface-3); color:var(--text); border-color:var(--border-2) }
  .tabs .off { color:var(--muted); font-weight:400 }
  .panel { font-size:13px; color:var(--text-2) } .panel h4 { color:var(--text); font-size:12px; text-transform:uppercase; letter-spacing:.06em; margin:14px 0 6px }
  .panel h4:first-child { margin-top:0 }
  pre { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin:6px 0; overflow:auto; font:12px/1.55 var(--mono); color:var(--text-2); white-space:pre-wrap }
  table { border-collapse:collapse; width:100% } th, td { text-align:left; padding:6px 10px 6px 0; border-bottom:1px solid var(--border); font-size:12.5px } th { color:var(--muted); font-weight:500 }
  .art { border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:10px }
  .art-h { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:8px 12px; background:var(--surface-2); border-bottom:1px solid var(--border); font-size:12.5px }
  .art-h .grow { flex:1 } .art-h .k { color:var(--muted) }
  .art-n { padding:6px 12px; font-size:12px; color:var(--amber); background:var(--amber-bg) }
  .md { padding:10px 16px; color:var(--text-2); font-size:13.5px; line-height:1.6 }
  .md h4 { color:var(--text); font-size:15px; margin:4px 0 8px; text-transform:none; letter-spacing:0 } .md h5 { color:var(--text); font-size:13.5px; margin:12px 0 4px }
  .md p { margin:4px 0 } .md li { margin:2px 0 } .md ul { margin:4px 0; padding-left:20px }
  .md code { background:var(--surface-3); padding:1px 5px; border-radius:4px; color:var(--text) }
  .md blockquote { margin:6px 0; padding:2px 12px; border-left:3px solid var(--border-2); color:var(--text-2) }
  .md .req { border:1px solid #3fb97055; background:var(--green-bg); border-radius:8px; padding:6px 14px 8px; margin:10px 0 }
  .md .req .lbl { color:var(--green); font-size:11px; text-transform:uppercase; letter-spacing:.07em; font-weight:600 }
  .kv { display:grid; grid-template-columns:140px 1fr; gap:4px 12px }
  .kv dt { color:var(--muted) } .kv dd { margin:0 }
  .empty { color:var(--muted) }
  .off-box { border:1px dashed var(--border-2); border-radius:8px; padding:10px 12px; color:var(--muted); font-size:12.5px; margin-top:8px }
  .bars { display:flex; flex-direction:column; gap:4px } .bar { display:grid; grid-template-columns:56px 1fr 30px; gap:8px; align-items:center; font-size:12px }
  .bar i { height:6px; border-radius:3px; background:var(--accent); display:block }

  /* ── dev bar ── */
  #dev { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); display:flex; gap:12px; align-items:center; z-index:20;
         background:#000; border:1px solid var(--border-2); color:var(--text-2); padding:6px 14px; border-radius:999px; font-size:12.5px; box-shadow:0 8px 30px #000a }
  #dev b { color:var(--text); font-weight:500 } #dev select { background:transparent; color:var(--text); border:none; font:inherit }
  #dev select option { color:#000 } #dev label { display:flex; gap:6px; align-items:center }
  #toast { position:fixed; right:20px; bottom:70px; max-width:420px; background:var(--surface-3); border:1px solid var(--border-2); padding:10px 14px; border-radius:8px; font-size:12.5px; display:none; white-space:pre-wrap; z-index:30 }

  @media (max-width: 960px) { .layout { grid-template-columns:1fr } aside { position:static; max-height:none } .meta .hide-sm { display:none } .top-in { flex-wrap:wrap } }
</style>
</head>
<body>
<header class="top"><div class="top-in" id="top"></div></header>
<div class="layout"><aside id="side"></aside><main id="main"></main></div>
<div id="toast"></div>
<div id="dev"><b>prototype</b>
  <select id="scen"><option value="live">live</option><option value="gate">waiting at a gate</option><option value="failed">failed</option><option value="ci">failed in CI</option><option value="done">done</option></select>
  <label><input type="checkbox" id="tr"> transcripts opted in</label></div>

<script>
// ─────────────────────────── the only input: domain events ───────────────────────────
const REPO = "schurik/meetrecap", ADW = "a9f259f0", ISSUE = 86, PR = 101, BASE = "20cfab6";
const TITLE = "Rework the action-items prompt and resolve relative due dates via the meeting date";
const T0 = Date.parse("2026-09-24T11:20:00Z");
const at = m => new Date(T0 + m * 60000).toISOString();
let SEQ = 0;
const E = (m, kind, data = {}) => ({ seq: ++SEQ, ts: at(m), kind, v: 1, ...data });
const TRANSCRIPT = new Set(["prompt_rendered", "harness_output"]);
const TOOLS = ["Read", "Grep", "Edit", "Bash", "Write"];
// tool_called is core: a name, ok and a duration. Never arguments, never results.
const tools = (m0, m1, phase, n, fail = 0) => Array.from({ length: n }, (_, i) =>
  E(m0 + (m1 - m0) * (i + 1) / (n + 1), "tool_called", { phase, tool: TOOLS[(i * 7 + n) % (i % 4 ? 3 : 5)], ok: !(fail && i % Math.ceil(n / fail) === 3), ms: 200 + (i * 373) % 4000 }));
const agent = (m, phase, owner, model, stage, description, extra = {}) =>
  E(m, "phase_started", { phase, pkind: "agent", owner, model, harness: "claude_code", description,
    task: `asf/stages/${stage}/task.md`, prompt_digest: `sha256:${(phase + owner).split("").map(c => c.charCodeAt(0).toString(16)).join("").slice(0, 12)}…`, ...extra });
const code = (m, phase, owner, description) => E(m, "phase_started", { phase, pkind: "code", owner, description });

// handoff files: invented text, shaped after the real ones
const DOCS = {
  issue: `# ${TITLE}\n\n> reported by schurik · quoted word for word, material to plan against\n\n## Problem\nFindings from the model comparison: rules and decisions from the meeting are extracted as tasks; several tasks get bundled into one item; relative deadlines ("in four weeks") stay relative.\n\n## Proposal\nGive the prompt a definition of an action item, one task per item, and the meeting date so due dates can be resolved.\n\n[[REQ]]\n## Requirements (agreed with schurik, round 2)\n- R1 The prompt receives the meeting date; there is no fallback to now.\n- R2 An action item is one task with one owner; standing rules are not items.\n- R3 Relative due dates resolve against the meeting date.\n- R4 Existing items are passed in so they are not duplicated.\n[[/REQ]]`,
  scout: `# Scout findings: #86\n\n## Where the prompt is built\n- \`lib/prompts.ts\`: \`buildActionItemsPrompt\` takes the transcript and existing items; no date.\n- \`convex/transcription.ts\`: two call sites (webhook, regenerate) reach \`extractActionItems\`.\n\n## Data\n- \`meetings.meetingDate\` is epoch ms at local midnight of the chosen day.\n\n## Tests\n- \`lib/prompts.test.ts\` snapshots the prompt; it will need updating.`,
  plan: `# Plan: action-items prompt rework (#86)\n\n1. \`buildActionItemsPrompt({ meetingDate })\`, required, shown as \`<meeting_date>\`.\n2. Convert in \`Europe/Berlin\`: the stored value is local midnight, UTC would be a day early.\n3. Rewrite the instructions: a definition, one task per item, standing rules excluded.\n4. Both call sites pass \`meeting.meetingDate\`.\n5. Tests: format, required input, both call sites.\n\n**Deviation**: the summary helpers stay untouched; only the action-items prompt changes.`,
  review: `# Review: issue #86\n\nVerdict: **approved**. All requirements are met.\n\n| # | Requirement | Met | Evidence |\n- R1 meetingDate required: yes, \`lib/prompts.ts\` params type\n- R2 one task per item: yes, instructions block + test\n- R3 relative dates: yes, \`<meeting_date>\` + rule\n- R4 existing items: yes, \`<existing_items>\` kept\n\nThe planner's deviation (summary helpers untouched) is accepted.`,
  document: `# Action-items prompt rework with meeting date (#86)\n\n## What changed\nThe prompt now knows the meeting date, so relative deadlines resolve to absolute dates.\n- \`buildActionItemsPrompt\` takes a required \`meetingDate\`.\n- The date is converted in \`Europe/Berlin\`.\n\n## Why\nRules were extracted as tasks, and relative dates were useless after the meeting.`,
  pr1: `# Review feedback on #${PR}\n\n> reviewers' requests about this branch, quoted word for word\n\n## Thread 1: \`lib/prompts.ts:124\`\n**schurik** wrote:\n> the format should be like this: "Sep 25, 2026"`,
  pr2: `# Review feedback on #${PR}\n\n> reviewers' requests about this branch, quoted word for word\n\n## Thread 1: \`lib/prompts.ts:346\`\n**schurik** wrote:\n> use this format everywhere in the prompt, also two lines below; nothing should still say YYYY-MM-DD`,
};
// what GitHub returns for a repo file at a commit: fetched on demand, never shipped
const GITHUB = {};

function story(scen) {
  SEQ = 0;
  const ci = scen === "ci";
  const st = ci ? { id: "st_ci_4471", name: "CI · run 4471", kind: "ci", owner: null }
                : { id: "st_7f3a", name: "schurik@mbp:~/Developer/meetrecap", kind: "local", owner: "schurik" };
  const spec = "docs/asf/spec/a9f259f0_action-items-prompt-rework.md", doc = "docs/asf/a9f259f0_action-items-meeting-date.md";
  GITHUB["3d212c7:" + spec] = DOCS.plan; GITHUB["5e6f7a8:" + doc] = DOCS.document;
  const ev = [
    E(0, "session_started", { request: TITLE, by: "schurik", base: `main@${BASE}`, station: st, work: { kind: "issue", n: ISSUE } }),
    E(0, "workflow_started", { workflow: "issue", trigger: "issue", by: "schurik", work: { kind: "issue", n: ISSUE } }),
    code(0.1, "issue", "tracker", "Read the reporter's own words and labels, before anyone plans."),
    E(0.2, "artifact_written", { phase: "issue", path: "issue.md", where: "handoff", role: "request", bytes: 12162, digest: "81c0…", content: DOCS.issue }),
    E(0.2, "phase_ended", { phase: "issue", status: "ok" }),
    agent(0.3, "scout", "scout", "claude-sonnet-5", "scout", "Find the code the request actually touches, so the plan is grounded."),

  const agents = ps.filter(p => p.pkind === "agent").length, tools = events().filter(e => e.kind === "tool_called").length;
  let html = `<div class="card now ${cls}"><div class="grow"><div class="lbl">Now</div><div class="big">${big}</div></div>
    <div class="stats"><div class="stat"><div class="v">$${s.cost.toFixed(2)}</div><div class="k">cost</div></div>
      <div class="stat"><div class="v">${agents}</div><div class="k">agent phases</div></div><div class="stat"><div class="v">${tools}</div><div class="k">tool calls</div></div></div></div>`;
  const chapters = events().filter(e => e.kind === "workflow_started");
  chapters.forEach((c, i) => {
    const mine = ps.filter(p => p.chapter === c), chCost = mine.reduce((a, p) => a + cost(p), 0);
    const req = mine.flatMap(artifactsOf).find(a => a.role === "request");
    const started = c.trigger === "pr" ? `started by ${c.by}'s review on PR #${c.work.n}` : `started by ${c.by} labelling issue #${c.work.n}`;
    html += `<section class="chapter"><div class="ch-head"><span class="ch-no">Chapter ${i + 1}</span><h2>${chapterName(c)}</h2><span class="sub">${started} · ${fmt(c.ts)}</span><span class="grow"></span><span class="cost">$${chCost.toFixed(2)}</span></div>`;
    if (req) html += `<div class="card asked"><div class="lbl">Asked <span class="mono">${req.name} · ${kb(req.bytes)}</span>
        <button class="toggle" onclick="toggleAsk(${i})">${openAsk.has(i) ? "Hide" : "Show"}</button></div>
        ${openAsk.has(i) ? `<div class="md" style="padding:10px 0 0">${md(req.body)}</div>` : `<div style="color:var(--text-2);margin-top:6px">${esc(firstLine(req.body))}</div>`}</div>`;
    html += `<div class="tl">${timeline(c, mine, s)}</div></section>`;
  });
  if (s.status === "running") html += `<div class="divider" style="margin:6px 0 0 70px"><span class="dot pulse" style="color:var(--accent)"></span> live · updating as events arrive</div>`;
  return html;
}
// the one line that says what was asked: a reviewer's own words, or the issue's problem statement
const firstLine = t => { const ls = t.split("\n"), q = ls.filter(l => l.startsWith("> ")), i = ls.indexOf("## Problem");
  return (i >= 0 ? ls.slice(i + 1).find(l => l.trim()) : q.length > 1 ? `“${q[q.length - 1].slice(2)}”` : q[0] || "").replace(/^> /, ""); };

function timeline(c, mine, s) {
  const items = [];
  for (const e of events()) if (e.kind === "session_resumed") {
    const inCh = mine.length && e.seq > mine[0].seq && e.seq < (mine[mine.length - 1].seq + 1e6) && mine.some(p => p.seq < e.seq) && mine.some(p => p.seq > e.seq);
    if (inCh) items.push([e.seq, `<div class="row compact"><div class="tm">${fmt(e.ts)}</div><div class="node"></div><div class="divider">▶ <b>Resumed</b> by the ${e.by} · ${events().filter(r => r.kind === "phase_replayed").map(r => r.phase).join(" and ")} replayed from their recorded envelopes, not rerun</div></div>`]);
  }
  for (const p of mine) {
    if (artifactsOf(p).some(a => a.role === "request")) continue;
    if (p.pkind === "human") { items.push(...gate(p, s)); continue; }
    items.push([p.seq, p.pkind === "agent" ? agentCard(p) : codeStep(p)]);
  }
  return items.sort((a, b) => a[0] - b[0]).map(i => i[1]).join("");
}

function agentCard(p) {
  const acc = p.events.find(e => e.kind === "envelope_accepted"), rej = p.events.filter(e => e.kind === "envelope_rejected");
  const nTools = p.events.filter(e => e.kind === "tool_called").length, open = openPh.has(p.id), arts = artifactsOf(p);
  const sum = acc ? `<b>${acc.type}</b>${acc.payload.summary ? ` · ${esc(acc.payload.summary)}` : ""}${rej.length ? ` <span class="pill neutral" style="margin-left:4px">${rej.length} correction</span>` : ""}`
    : `<span style="color:var(--accent)">working…</span>`;
  const notes = p.events.filter(e => e.kind === "journal_noted").map(e => `<div class="note"><span class="t">${e.type}</span><span>${esc(e.note)}</span></div>`).join("");
  return `<div class="row ${p.status}" id="ph-${p.id}"><div class="tm">${fmt(p.start)}</div><div class="node"></div>
    <div class="card ph ${open ? "open sel" : ""}">
      <div class="ph-head" onclick="togglePh(${p.id})"><span class="ph-name">${p.phase}</span>
        <span class="kind">${p.owner} · <span class="mono">${shortModel(p.model)}</span></span>
        ${p.replayed ? `<span class="pill neutral">replayed on resume</span>` : ""}<span class="grow"></span>
        <span class="meta"><span class="hide-sm">${nTools} tools</span><span>${dur(p) || "…"}</span><span>$${cost(p).toFixed(2)}</span></span><span class="chev">▶</span></div>
      <div class="ph-sum">${sum}</div>
      ${acc && acc.payload.changed_files ? `<div class="files">${acc.payload.changed_files.length} files · ${acc.payload.changed_files.join(" · ")}</div>` : ""}
      ${arts.length ? `<div class="chips">${arts.map(a => `<a class="chip" href="#" onclick="openArt(${p.id});return false">📄 ${esc(a.name)} <span class="k">${a.where === "tree" ? "repo" : "handoff"}</span></a>`).join("")}</div>` : ""}
      ${notes}
      ${open ? `<div class="detail">${tabs(p)}</div>` : ""}
    </div></div>`;
}

function codeStep(p) {
  const c = p.events.filter(e => e.kind === "command_finished"), k = p.events.find(e => e.kind === "committed");
  const auto = p.events.find(e => e.kind === "decision_recorded" && e.by === "policy");
  const bad = c.filter(e => e.exit), open = openPh.has(p.id);
  let what = c.map(e => `<span class="${e.exit ? "bad" : "ok"}">${e.exit ? "✕" : "✓"}</span> <span class="mono">${esc(e.argv.join(" "))}</span>`).join(" ");
  if (k) what = `<span class="mono" style="color:var(--text)">${k.sha}</span> ${esc(k.message)}`;
  if (p.phase === "changes") what = `diff against <span class="mono">${BASE}</span> · <a href="#">compare on GitHub ↗</a>`;
  return `<div class="row compact ${p.status}" id="ph-${p.id}"><div class="tm">${fmt(p.start)}</div><div class="node"></div><div>
    <div class="step"><span class="n">${p.phase}</span><span>${what}</span><span class="grow"></span><span class="d">${dur(p)}</span><a class="more" href="#" onclick="togglePh(${p.id});return false">${open ? "hide" : "details"}</a></div>
    ${auto ? `<div class="step" style="padding-left:0"><span class="pill neutral">⚙ ${auto.gate} gate approved by policy · automatic, nobody was asked</span></div>` : ""}
    ${bad.length ? `<pre class="step-fail">${esc(bad[bad.length - 1].tail)}</pre><div class="step"><span class="pill bad">${esc(p.error || "failed")}</span></div>` : ""}
    ${open ? `<div class="card" style="padding:12px 14px;margin:4px 0 8px">${tabs(p)}</div>` : ""}</div></div>`;
}

function gate(p, s) {
  const out = [], sus = p.events.filter(e => e.kind === "suspended");
  for (const e of sus) {
    const dec = p.events.find(d => d.kind === "decision_recorded" && d.round === e.waiting_for.round && d.seq > e.seq);
    const commit = p.events.filter(c => c.kind === "committed" && c.seq < e.seq).pop();
    const waiting = s.waiting && s.waiting.seq === e.seq, cls = dec ? (dec.verdict === "approve" ? "ok" : "bad") : "";
    out.push([p.seq, `<div class="row ${waiting ? "waiting" : dec ? "ok" : ""}" id="ph-${p.id}"><div class="tm">${fmt(e.ts)}</div><div class="node"></div>
      <div class="card gate ${cls}"><h3>◐ ${e.waiting_for.gate[0].toUpperCase() + e.waiting_for.gate.slice(1)} gate · round ${e.waiting_for.round}
          ${dec ? `<span class="pill ${dec.verdict === "approve" ? "ok" : "bad"}">${dec.verdict === "approve" ? "approved" : "rejected"} by ${dec.by}</span>` : `<span class="pill warn">waiting</span>`}</h3>
        <div class="ln">Asked on issue #${e.waiting_for.issue_number} · subject <a href="#" class="mono">${e.head_sha}</a>${commit ? `, committed and pushed before asking` : ""}</div>
        ${dec ? `<div class="ln">Answered ${fmt(dec.ts)} via ${dec.channel} · waited ${mins((Date.parse(dec.ts) - Date.parse(e.ts)) / 60000)}</div>${dec.notes ? `<div class="remark"><span class="t">✎ instruction</span>${esc(dec.notes)}</div>` : ""}`
              : `<div class="ln" style="margin-top:10px"><button class="btn primary" onclick="send('answer')">Answer in inbox →</button></div>`}
      </div></div>`]);
  }
  return out;
}

// ─────────────────────────── tabs ───────────────────────────
const TABS = { artifacts: "Artifacts", overview: "Overview", checks: "Checks", tools: "Tools", transcript: "Transcript", cost: "Cost", events: "Events" };
function tabs(p) {
  const arts = artifactsOf(p);
  const has = { artifacts: arts.length > 0, overview: p.pkind === "agent", checks: p.pkind !== "agent" || p.events.some(e => e.kind === "gate_result"),
                tools: p.pkind === "agent", transcript: p.pkind === "agent", cost: p.pkind === "agent", events: true };
  const list = Object.keys(TABS).filter(k => has[k]);
  let cur = tabOf[p.id]; if (!list.includes(cur)) cur = list[0];
  const body = { artifacts: tArtifacts(arts), overview: tOverview(p), checks: tChecks(p), tools: tTools(p), transcript: tTranscript(p), cost: tCost(p),
    events: `<pre>${p.events.map(e => `#${String(e.seq).padEnd(4)} ${fmt(e.ts)}  ${e.kind}`).join("\n")}</pre>` }[cur];
  return `<div class="tabs">${list.map(k => `<button class="${k === cur ? "on" : ""}" onclick="tabPh(${p.id},'${k}')">${TABS[k]}${k === "transcript" && !transcripts ? ` <span class="off">· off</span>` : ""}</button>`).join("")}</div><div class="panel">${body}</div>`;
}
function tArtifacts(arts) {
  return arts.map(a => `<div class="art"><div class="art-h"><span>📄</span><span class="mono" style="color:var(--text)">${esc(a.path)}</span>
      <span class="pill ${a.where === "tree" ? "run" : "neutral"}">${a.where === "tree" ? "in the repo" : "handoff"}</span><span class="grow"></span>
      <span class="k">${kb(a.bytes)} · ${a.at}</span>${a.sha ? `<a href="#">GitHub ↗</a>` : ""}</div>
    ${a.same_as_handoff ? `<div class="art-n" style="color:var(--muted);background:none;border-bottom:1px solid var(--border)">The handoff copy <span class="mono">${a.same_as_handoff}</span> is byte-identical, so it is not shipped twice.</div>` : ""}
    ${a.later ? `<div class="art-n">Changed later: this is the version at ${a.sha}; ${a.later} edited it again. <a href="#">Compare ↗</a></div>` : ""}
    ${a.body ? `<div class="md">${md(a.body)}</div>` : `<div class="md empty">Not committed yet: repo files are read from GitHub at a commit.</div>`}</div>`).join("");
}
function tOverview(p) {
  const acc = p.events.find(e => e.kind === "envelope_accepted"), rej = p.events.filter(e => e.kind === "envelope_rejected");
  return `<dl class="kv"><dt>Description</dt><dd>${esc(p.description)}</dd><dt>Harness</dt><dd class="mono">${p.harness} · ${p.model}</dd>
      <dt>Instructions</dt><dd><a href="#" class="mono">${p.task}</a> at <span class="mono">${BASE}</span></dd></dl>
    ${rej.map(r => `<h4>Rejected envelope · attempt ${r.attempt}</h4><div>${esc(r.reason)} <span class="empty">→ re-prompted the same session as a correction</span></div>`).join("")}
    <h4>Envelope · ${acc ? acc.type : "none yet"}</h4>${acc ? `<pre>${esc(JSON.stringify(acc.payload, null, 2))}</pre>` : `<div class="empty">The agent has not reported yet.</div>`}`;
}
function tChecks(p) {
  const out = [];
  for (const e of p.events) {
    if (e.kind === "gate_result") out.push(`<div style="margin:4px 0"><span class="pill ${e.ok ? "ok" : "bad"}">${e.ok ? "pass" : "fail"}</span> gate <b style="color:var(--text)">${e.gate}</b> · attempt ${e.attempt}${e.checks.map(c => c.note ? ` · ${esc(c.item)}: ${esc(c.note)}` : "").join("")}</div>`);
    if (e.kind === "command_finished") out.push(`<h4><span class="mono" style="text-transform:none;letter-spacing:0">$ ${esc(e.argv.join(" "))}</span> · exit ${e.exit} · ${e.ms < 1000 ? e.ms + "ms" : (e.ms / 1000).toFixed(1) + "s"}</h4><pre>${esc(e.tail)}</pre>`);
    if (e.kind === "committed") out.push(`<div style="margin:4px 0">⎇ <span class="mono" style="color:var(--text)">${e.sha}</span> on <span class="mono">${e.branch}</span>${e.pushed ? " · pushed" : ""} · ${esc(e.message)}</div>`);
  }
  return out.join("") || `<div class="empty">Nothing ran here.</div>`;
}
function tTools(p) {
  const t = p.events.filter(e => e.kind === "tool_called");
  if (!t.length) return `<div class="empty">No tool calls yet.</div>`;
  const by = {}; t.forEach(e => by[e.tool] = (by[e.tool] || 0) + 1);
  const max = Math.max(...Object.values(by)), failed = t.filter(e => !e.ok);
  return `<div class="bars">${Object.entries(by).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<div class="bar"><span class="mono">${k}</span><i style="width:${n / max * 100}%"></i><span>${n}</span></div>`).join("")}</div>
    ${failed.length ? `<h4>Failed calls</h4>${failed.map(e => `<div class="mono">${fmt(e.ts)} ✕ ${e.tool} · ${e.ms}ms</div>`).join("")}` : ""}
    <div class="off-box">Tool calls are a core event: the name, whether it worked, and how long it took. What a call was given and returned is transcript material${transcripts ? ", on the Transcript tab" : ", and this factory has not opted in"}.</div>`;
}
function tTranscript(p) {
  if (!transcripts) return `<div>The instructions are <a href="#" class="mono">${p.task}</a> at <span class="mono">${BASE}</span>, plus the journal as of this phase. The rendered prompt's digest is <span class="mono">${p.prompt_digest}</span>.</div>
    <div class="off-box">Transcripts are off for this factory: the rendered prompt and the harness output were not shipped. <span class="mono">cockpit.transcripts: true</span> in <span class="mono">factory.yaml</span> turns them on.</div>`;
  const out = p.events.filter(e => e.kind === "harness_output").map(e => e.chunk).join("\n");
  return `<h4>Harness output</h4><pre>${esc(out) || "(nothing in this fake data yet)"}</pre>`;
}
function tCost(p) {
  const u = p.events.filter(e => e.kind === "usage");
  if (!u.length) return `<div class="empty">No usage reported yet.</div>`;
  const s = k => u.reduce((a, e) => a + e[k], 0), last = u[u.length - 1], pct = Math.round(last.context[0] / last.context[1] * 100);
  return `<table><tr><th>Input</th><th>Output</th><th>Cache read</th><th>Cost</th></tr>
    <tr><td>${s("input").toLocaleString()}</td><td>${s("output").toLocaleString()}</td><td>${s("cache_read").toLocaleString()}</td><td style="color:var(--text)">$${s("cost").toFixed(2)}</td></tr></table>
    <h4>Context window</h4><div class="bar" style="grid-template-columns:1fr 110px"><i style="width:${pct}%"></i><span>${Math.round(last.context[0] / 1000)}k / ${last.context[1] / 1000}k · ${pct}%</span></div>`;
}

// ─────────────────────────── wiring ───────────────────────────
function render() {
  const s = summary(), ps = phases();
  document.getElementById("top").innerHTML = topBar(s);
  document.getElementById("side").innerHTML = sideBar(s, ps);
  document.getElementById("main").innerHTML = mainCol(s, ps);
  document.getElementById("scen").value = scen;
  document.getElementById("tr").checked = transcripts;
}
function send(verb) {
  const msg = { kill: `WOULD queue {verb: kill, session: ${ADW}, by: schurik, station: st_7f3a, ttl: 5m}`,
    resume: `WOULD queue {verb: resume, session: ${ADW}, by: schurik, station: st_7f3a}`,
    answer: "WOULD open this gate's answer view in the inbox. The inbox owns answering." }[verb];
  const t = document.getElementById("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(send.t); send.t = setTimeout(() => t.style.display = "none", 4000);
}
function togglePh(id) { openPh.has(id) ? openPh.delete(id) : openPh.add(id); render(); }
function tabPh(id, k) { tabOf[id] = k; render(); }
function openArt(id) { openPh.add(id); tabOf[id] = "artifacts"; render(); }
function toggleAsk(i) { openAsk.has(i) ? openAsk.delete(i) : openAsk.add(i); render(); }
function setSide(t) { sideTab = t; render(); }
function jump(id) { const p = phases().find(x => x.id === id); if (p && p.pkind !== "human") openPh.add(id); render();
  const el = document.getElementById("ph-" + id); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - 100, behavior: "smooth" }); }
function sync() { const u = new URL(location); u.searchParams.set("s", scen); u.searchParams.set("t", transcripts ? "1" : "0"); u.searchParams.delete("variant"); history.replaceState(null, "", u); }
document.getElementById("scen").onchange = e => { scen = e.target.value; openPh.clear(); sync(); load(); };
document.getElementById("tr").onchange = e => { transcripts = e.target.checked; sync(); load(); };
sync(); load();
</script>
</body>
</html>
