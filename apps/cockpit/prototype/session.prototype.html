<!doctype html>
<!--
  PROTOTYPE, throwaway. It answers one question for the wayfinder ticket
  "The session view: what the cockpit shows for one run" (#33).

  It shows one session's page, built only from domain events, switchable via
  ?variant=A|B|C|D (or ← / →):
    A  Waterfall: the legacy visualizer's shape (lanes over time, phase panel).
    B  Stepper: the phases as an outline, with tabs for one phase.
    C  Story: a readable account in time order, grouped into chapters.
    D  Story + tabs: C as the page, with B's tabs inside each phase. This is the chosen shape.

  The data is shaped after a real, complete session (issue → pr-review ×2, 24 phases).
  Its text is invented.

  The catalogue this assumes: the one from ticket #27, plus the additions this ticket decided:
    workflow_started / workflow_finished  a session passes through several workflows (chapters)
    artifact_written                      handoff files (content inline) and repo files (reference)
    committed                             the sha that makes a repo file readable on GitHub
    tool_called                           core; the name, ok and ms only, never arguments or results
    session_resumed / phase_replayed      resume is folded, not shown as re-run
    phase_started.task / .prompt_digest   which instructions, without shipping the prompt
    decision_recorded.by = "policy"       automatic, never shown as a person's verdict

  The floating bar also switches:
    ?s=live|gate|failed|ci|done  the session's situation
    ?t=0|1                       transcripts opted in (prompt_rendered, harness_output)

  Data is fake and in memory. Commands print what they WOULD send.
  To open it: `open apps/cockpit/prototype/session.prototype.html`
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session prototype</title>
<style>
  :root { --bg:#f6f6f4; --panel:#fff; --ink:#1c1c1a; --mute:#6b6b66; --line:#e2e1dc;
          --accent:#2f5bd3; --ok:#1f8a4c; --bad:#b83a2e; --warn:#a86b00; --code:#f1f0ec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151514; --panel:#1e1e1c; --ink:#ecebe6;
          --mute:#9a9992; --line:#2f2f2c; --accent:#7d9bff; --ok:#4cc27d; --bad:#ff7b6b; --warn:#e0a53a; --code:#262623; } }
  * { box-sizing:border-box } body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  a { color:var(--accent) }
  .mute { color:var(--mute) } .mono { font-family:ui-monospace, monospace; font-size:12.5px }
  .tag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:12px; background:var(--code); color:var(--mute); white-space:nowrap }
  .tag.ok { background:#1f8a4c22; color:var(--ok) } .tag.bad { background:#b83a2e22; color:var(--bad) }
  .tag.warn { background:#a86b0022; color:var(--warn) } .tag.run { background:#2f5bd322; color:var(--accent) }
  pre { background:var(--code); padding:10px 12px; border-radius:6px; overflow:auto; margin:6px 0; font-size:12.5px; white-space:pre-wrap }
  button { font:inherit; padding:5px 11px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer }
  button:disabled { opacity:.45; cursor:not-allowed } button.danger { color:var(--bad); border-color:var(--bad) }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--mute); vertical-align:middle }
  .dot.on { background:var(--ok) } .dot.off { background:var(--bad) } .dot.pulse { animation:p 1.2s infinite }
  @keyframes p { 50% { opacity:.3 } }
  details { margin:6px 0 } summary { cursor:pointer; color:var(--mute); font-size:13px }
  .gap { border:1px dashed var(--warn); color:var(--warn); border-radius:6px; padding:8px 10px; font-size:12.5px; margin:8px 0 }
  .md { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 14px; font-size:13px }
  .md h4 { margin:4px 0 6px; font-size:14px } .md h5 { margin:8px 0 2px; font-size:13px } .md code { background:var(--code); padding:0 3px; border-radius:3px }
  .md blockquote { margin:4px 0; padding-left:10px; border-left:3px solid var(--line); color:var(--mute) }
  .md .req { border:1px solid var(--ok); border-radius:6px; padding:4px 10px; margin:6px 0 }

  #head { background:var(--panel); border-bottom:1px solid var(--line); padding:12px 20px }
  #head .crumbs { font-size:12.5px; color:var(--mute) }
  #head .row { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; margin-top:4px }
  #head h1 { font-size:18px; margin:0 }
  #head .cmds { margin-left:auto; display:flex; gap:8px; align-items:center }
  #head .why { font-size:12px; color:var(--mute); max-width:340px; text-align:right }
  #out { position:fixed; right:16px; bottom:64px; max-width:440px; background:var(--ink); color:var(--bg); padding:10px 14px; border-radius:8px; font-size:12.5px; display:none; white-space:pre-wrap; z-index:10 }
  #switch { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:10px; align-items:center;
            background:#111; color:#fff; padding:6px 12px; border-radius:20px; box-shadow:0 4px 16px #0005; font-size:13px; z-index:9; white-space:nowrap }
  #switch button, #switch select { background:transparent; color:#fff; border:none; padding:2px 6px; font:inherit }
  #switch select option { color:#000 } #switch label { display:flex; gap:4px; align-items:center }

  /* A: waterfall */
  .A { display:grid; grid-template-columns:1fr 420px; min-height:calc(100vh - 90px) } .A.closed { grid-template-columns:1fr }
  .A .wf { padding:16px 20px 90px; overflow:auto }
  .A .axis { display:flex; justify-content:space-between; font-size:11px; color:var(--mute); margin-left:130px; border-bottom:1px solid var(--line) }
  .A .lane { display:flex; align-items:center; min-height:38px; border-bottom:1px solid var(--line) }
  .A .lane .who { width:130px; font-size:12.5px; flex:none } .A .lane .who small { display:block; color:var(--mute); font-size:11px }
  .A .track { position:relative; flex:1; height:30px }
  .A .blk { position:absolute; top:4px; height:22px; border-radius:4px; font-size:11px; padding:2px 5px; overflow:hidden; white-space:nowrap; cursor:pointer; background:#2f5bd333; border:1px solid var(--accent) }
  .A .blk.ok { background:#1f8a4c26; border-color:var(--ok) } .A .blk.bad { background:#b83a2e26; border-color:var(--bad) }
  .A .blk.wait { background:#a86b0026; border-color:var(--warn); border-style:dashed } .A .blk.sel { outline:2px solid var(--ink) }
  .A .tick { position:absolute; bottom:1px; width:1px; height:6px; background:var(--mute) } .A .tick.bad { background:var(--bad); width:2px }
  .A .panel { border-left:1px solid var(--line); background:var(--panel); padding:14px 18px 90px; overflow:auto; max-height:calc(100vh - 90px); position:sticky; top:0 }
  /* B: stepper; its .tabs are reused by D */
  .B { display:grid; grid-template-columns:300px 1fr; min-height:calc(100vh - 90px) }
  .B .steps { background:var(--panel); border-right:1px solid var(--line); padding:12px 0 90px }
  .B .chap { padding:10px 14px 2px; font-size:11.5px; color:var(--mute); text-transform:uppercase; letter-spacing:.05em }
  .B .step { display:grid; grid-template-columns:22px 1fr auto; gap:6px; padding:6px 14px; cursor:pointer; align-items:start }
  .B .step.sel { background:var(--code); box-shadow:inset 3px 0 var(--accent) }
  .B .step .g { text-align:center } .B .step small { display:block; color:var(--mute); font-size:11.5px }
  .B .body { padding:16px 26px 90px; overflow:auto }
  .tabs { display:flex; flex-wrap:wrap; gap:2px; border-bottom:1px solid var(--line); margin:10px 0 12px }
  .tabs button { border:none; border-bottom:2px solid transparent; border-radius:0; background:none; color:var(--mute) }
  .tabs button.on { border-color:var(--accent); color:var(--ink) }
  table { border-collapse:collapse; font-size:12.5px } td, th { padding:3px 10px 3px 0; text-align:left }
  /* C, D: story */
  .C { max-width:800px; margin:18px auto 100px; padding:0 16px }
  .C .now { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 20px; margin-bottom:18px }
  .C .now .big { font-size:18px; margin:2px 0 6px }
  .C .chapter { display:flex; align-items:baseline; gap:10px; margin:26px 0 10px; padding-bottom:4px; border-bottom:2px solid var(--line) }
  .C .chapter h2 { font-size:16px; margin:0 } .C .chapter span { font-size:12.5px; color:var(--mute) }
  .C .asked { background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:6px; padding:8px 12px; margin:0 0 14px 8px }
  .C .beat { position:relative; padding:0 0 16px 26px; border-left:2px solid var(--line); margin-left:8px }
  .C .beat::before { content:""; position:absolute; left:-7px; top:3px; width:12px; height:12px; border-radius:50%; background:var(--panel); border:2px solid var(--mute) }
  .C .beat.ok::before { border-color:var(--ok) } .C .beat.bad::before { border-color:var(--bad) } .C .beat.run::before { border-color:var(--accent); animation:p 1.2s infinite }
  .C .beat.quiet::before { width:8px; height:8px; left:-5px; top:6px } .C .beat.quiet { color:var(--mute); font-size:13px; padding-bottom:10px }
  .C .beat.human .card { border-left:3px solid var(--warn); background:var(--panel); padding:8px 12px; border-radius:6px }
  .C .beat h3 { font-size:14.5px; margin:0 0 3px } .C .beat .t { font-size:11.5px; color:var(--mute) }
  .C .note { font-style:italic; color:var(--mute) }
  .D .more { font-size:13px; margin-top:4px } .D .more > a { color:var(--mute); text-decoration:none } .D .tabs button { font-size:12.5px; padding:4px 10px }
  @media (max-width: 860px) { .A, .B { grid-template-columns:1fr } .A .panel { position:static; max-height:none } #head .cmds { margin-left:0 } }
</style>
</head>
<body>
<div id="head"></div>
<main id="app"></main>
<div id="out"></div>
<div id="switch">
  <button id="prev">←</button><span id="label"></span><button id="next">→</button>
  <select id="scen"><option value="live">live</option><option value="gate">at a gate</option><option value="failed">failed</option><option value="ci">failed in CI</option><option value="done">done</option></select>
  <label><input type="checkbox" id="tr"> transcripts</label>
</div>

<script>
// ─────────────────────────── the only input: domain events ───────────────────────────
const REPO = "schurik/meetrecap", ADW = "a9f259f0", ISSUE = 86, PR = 101, BASE = "20cfab6";
const TITLE = "Rework the action-items prompt and resolve relative due dates via the meeting date";
const T0 = Date.parse("2026-09-24T11:20:00Z");
const at = m => new Date(T0 + m * 60000).toISOString();
let SEQ = 0;
const E = (m, kind, data = {}) => ({ seq: ++SEQ, ts: at(m), kind, v: 1, ...data });
const TRANSCRIPT = new Set(["prompt_rendered", "harness_output"]);
const TOOLS = ["Read", "Grep", "Edit", "Bash", "Write"];
// tool_called is core: a name, ok and a duration. Never arguments, never results.
const tools = (m0, m1, phase, n, fail = 0) => Array.from({ length: n }, (_, i) =>
  E(m0 + (m1 - m0) * (i + 1) / (n + 1), "tool_called", { phase, tool: TOOLS[(i * 7 + n) % (i % 4 ? 3 : 5)], ok: !(fail && i % Math.ceil(n / fail) === 3), ms: 200 + (i * 373) % 4000 }));
const agent = (m, phase, owner, model, stage, description, extra = {}) =>
  E(m, "phase_started", { phase, pkind: "agent", owner, model, harness: "claude_code", description,
    task: `asf/stages/${stage}/task.md`, prompt_digest: `sha256:${(phase + owner).split("").map(c => c.charCodeAt(0).toString(16)).join("").slice(0, 12)}…`, ...extra });
const code = (m, phase, owner, description) => E(m, "phase_started", { phase, pkind: "code", owner, description });

// handoff files: invented text, shaped after the real ones
const DOCS = {
  issue: `# ${TITLE}\n\n> reported by schurik · quoted word for word, material to plan against\n\n## Problem\nFindings from the model comparison: rules and decisions from the meeting are extracted as tasks; several tasks get bundled into one item; relative deadlines ("in four weeks") stay relative.\n\n## Proposal\nGive the prompt a definition of an action item, one task per item, and the meeting date so due dates can be resolved.\n\n[[REQ]]\n## Requirements (agreed with schurik, round 2)\n- R1 The prompt receives the meeting date; there is no fallback to now.\n- R2 An action item is one task with one owner; standing rules are not items.\n- R3 Relative due dates resolve against the meeting date.\n- R4 Existing items are passed in so they are not duplicated.\n[[/REQ]]`,
  scout: `# Scout findings: #86\n\n## Where the prompt is built\n- \`lib/prompts.ts\`: \`buildActionItemsPrompt\` takes the transcript and existing items; no date.\n- \`convex/transcription.ts\`: two call sites (webhook, regenerate) reach \`extractActionItems\`.\n\n## Data\n- \`meetings.meetingDate\` is epoch ms at local midnight of the chosen day.\n\n## Tests\n- \`lib/prompts.test.ts\` snapshots the prompt; it will need updating.`,
  plan: `# Plan: action-items prompt rework (#86)\n\n1. \`buildActionItemsPrompt({ meetingDate })\`, required, shown as \`<meeting_date>\`.\n2. Convert in \`Europe/Berlin\`: the stored value is local midnight, UTC would be a day early.\n3. Rewrite the instructions: a definition, one task per item, standing rules excluded.\n4. Both call sites pass \`meeting.meetingDate\`.\n5. Tests: format, required input, both call sites.\n\n**Deviation**: the summary helpers stay untouched; only the action-items prompt changes.`,
  review: `# Review: issue #86\n\nVerdict: **approved**. All requirements are met.\n\n| # | Requirement | Met | Evidence |\n- R1 meetingDate required: yes, \`lib/prompts.ts\` params type\n- R2 one task per item: yes, instructions block + test\n- R3 relative dates: yes, \`<meeting_date>\` + rule\n- R4 existing items: yes, \`<existing_items>\` kept\n\nThe planner's deviation (summary helpers untouched) is accepted.`,
  document: `# Action-items prompt rework with meeting date (#86)\n\n## What changed\nThe prompt now knows the meeting date, so relative deadlines resolve to absolute dates.\n- \`buildActionItemsPrompt\` takes a required \`meetingDate\`.\n- The date is converted in \`Europe/Berlin\`.\n\n## Why\nRules were extracted as tasks, and relative dates were useless after the meeting.`,
  pr1: `# Review feedback on #${PR}\n\n> reviewers' requests about this branch, quoted word for word\n\n## Thread 1: \`lib/prompts.ts:124\`\n**schurik** wrote:\n> the format should be like this: "Sep 25, 2026"`,
  pr2: `# Review feedback on #${PR}\n\n> reviewers' requests about this branch, quoted word for word\n\n## Thread 1: \`lib/prompts.ts:346\`\n**schurik** wrote:\n> use this format everywhere in the prompt, also two lines below; nothing should still say YYYY-MM-DD`,
};
// what GitHub returns for a repo file at a commit: fetched on demand, never shipped
const GITHUB = {};

function story(scen) {
  SEQ = 0;
  const ci = scen === "ci";
  const st = ci ? { id: "st_ci_4471", name: "CI · run 4471", kind: "ci", owner: null }
                : { id: "st_7f3a", name: "schurik@mbp:~/Developer/meetrecap", kind: "local", owner: "schurik" };
  const spec = "docs/asf/spec/a9f259f0_action-items-prompt-rework.md", doc = "docs/asf/a9f259f0_action-items-meeting-date.md";
  GITHUB["3d212c7:" + spec] = DOCS.plan; GITHUB["5e6f7a8:" + doc] = DOCS.document;
  const ev = [
    E(0, "session_started", { request: TITLE, by: "schurik", base: `main@${BASE}`, station: st, work: { kind: "issue", n: ISSUE } }),
    E(0, "workflow_started", { workflow: "issue", trigger: "issue", by: "schurik", work: { kind: "issue", n: ISSUE } }),
    code(0.1, "issue", "tracker", "Read the reporter's own words and labels, before anyone plans."),
    E(0.2, "artifact_written", { phase: "issue", path: "issue.md", where: "handoff", role: "request", bytes: 12162, digest: "81c0…", content: DOCS.issue }),
    E(0.2, "phase_ended", { phase: "issue", status: "ok" }),
    agent(0.3, "scout", "scout", "claude-sonnet-5", "scout", "Find the code the request actually touches, so the plan is grounded."),
    ...tools(0.3, 2.5, "scout", 22),
    E(2.5, "envelope_accepted", { phase: "scout", owner: "scout", type: "ScoutOutput", attempt: 1, payload: { summary: "The prompt is built in lib/prompts.ts; two call sites.", findings: 4 } }),
    E(2.5, "artifact_written", { phase: "scout", path: "scout_findings.md", where: "handoff", role: "output", bytes: 3289, digest: "1f9e…", content: DOCS.scout }),
    E(2.5, "usage", { phase: "scout", owner: "scout", input: 190000, output: 4100, cache_read: 120000, cost: 0.21, context: [58000, 200000] }),
    E(2.5, "phase_ended", { phase: "scout", status: "ok" }),
    agent(2.6, "plan", "planner", "claude-opus-5-5", "plan", "Turn the request into an implementable plan, before any code is written."),
    ...tools(2.6, 8.4, "plan", 31),
    E(8.4, "envelope_rejected", { phase: "plan", owner: "planner", type: "PlanOutput", attempt: 1, reason: "artifact docs/asf/spec/… is empty" }),
    E(8.9, "envelope_accepted", { phase: "plan", owner: "planner", type: "PlanOutput", attempt: 2, payload: { summary: "Required meetingDate, Berlin time, rewritten instructions.", commit_message: "Add spec for reworking the action-items prompt (#86)" } }),
    E(8.9, "artifact_written", { phase: "plan", path: spec, where: "tree", role: "output", bytes: 14819, digest: "40f8…", same_as_handoff: "plan.md" }),
    E(8.9, "journal_noted", { phase: "plan", by: "planner", type: "deviation", note: "The summary helpers stay untouched; only the action-items prompt changes." }),
    E(8.9, "journal_noted", { phase: "plan", by: "planner", type: "risk", note: "meetingDate is local midnight; converting in UTC would give the previous day." }),
    E(8.9, "usage", { phase: "plan", owner: "planner", input: 610000, output: 21000, cache_read: 500000, cost: 1.02, context: [121000, 200000] }),
    E(8.9, "phase_ended", { phase: "plan", status: "ok" }),
    E(9.0, "phase_started", { phase: "approve_plan", pkind: "human", owner: "schurik", description: "Hand the plan to a person and wait for a verdict." }),
    E(9.1, "committed", { phase: "approve_plan", sha: "3d212c7", branch: `asf/${ADW}`, pushed: true, paths: [spec], message: "Add spec for reworking the action-items prompt (#86)" }),
    E(9.2, "suspended", { phase: "approve_plan", waiting_for: { gate: "plan", round: 1, channel: "issue", issue_number: ISSUE }, base_commit: BASE, head_sha: "3d212c7" }),
  ];
  if (scen === "gate") return { ev, st, online: false };
  ev.push(
    E(37, "decision_recorded", { phase: "approve_plan", gate: "plan", round: 1, verdict: "approve", by: "schurik", channel: "issue", notes: "Keep the prompt in English; the examples may stay German." }),
    E(37.2, "session_resumed", { by: "answers watcher", station: st.id }),
    E(37.3, "phase_replayed", { phase: "scout", source_seq: 2 }),
    E(37.3, "phase_replayed", { phase: "plan", source_seq: 3 }),
    E(37.4, "phase_ended", { phase: "approve_plan", status: "ok" }),
    agent(37.5, "implement", "builder", "claude-opus-5-5", "implement", "Implement the plan exactly, or the request itself when there is no plan."),
    ...tools(37.5, 45.8, "implement", 58, 2),
    E(45.9, "envelope_accepted", { phase: "implement", owner: "builder", type: "BuildOutput", attempt: 1, payload: { changed_files: ["lib/prompts.ts", "lib/prompts.test.ts", "convex/transcription.ts", "convex/transcription.test.ts", "docs/audio-transcription-sequence.md"] } }),
    E(45.9, "journal_noted", { phase: "implement", by: "builder", type: "discovery", note: "The regenerate path also built the prompt without a date; fixed in the same place." }),
    E(45.9, "usage", { phase: "implement", owner: "builder", input: 820000, output: 30000, cache_read: 700000, cost: 1.35, context: [148000, 200000] }),
    E(45.9, "phase_ended", { phase: "implement", status: "ok" }),
    code(46, "verify_1", "quality", "Run test: a known command, so code runs it and no agent does."),
    E(46.1, "command_finished", { phase: "verify_1", argv: ["bun", "test"], exit: 0, ms: 26, tail: "88 pass\n0 fail\n219 expect() calls" }),
    E(46.1, "gate_result", { phase: "verify_1", gate: "tests", ok: true, attempt: 1, checks: [{ item: "bun test", ok: true }] }),
    E(46.1, "phase_ended", { phase: "verify_1", status: "ok" }),
    agent(46.2, "review_1", "reviewer", "claude-opus-5-5", "review", "Confirm the build matches what was asked, against the plan and the requirements."),
    ...tools(46.2, 50, "review_1", 27),
    E(50, "envelope_accepted", { phase: "review_1", owner: "reviewer", type: "ReviewOutput", attempt: 1, payload: { approved: true, blocking: [] } }),
    E(50, "artifact_written", { phase: "review_1", path: "review.md", where: "handoff", role: "output", bytes: 4020, digest: "9a31…", content: DOCS.review }),
    E(50, "journal_noted", { phase: "review_1", by: "reviewer", type: "risk", note: "The prompt snapshot test pins German examples; a later language change will touch it." }),
    E(50, "usage", { phase: "review_1", owner: "reviewer", input: 330000, output: 9000, cache_read: 260000, cost: 0.66, context: [96000, 200000] }),
    E(50, "phase_ended", { phase: "review_1", status: "ok" }),
    code(50.1, "commit_implement", "git", "Land the implement on the run's branch, in the words of the agent that did it."),
    E(50.2, "committed", { phase: "commit_implement", sha: "a1b2c3d", branch: `asf/${ADW}`, pushed: true, paths: [], message: "Resolve relative due dates via the meeting date (#86)" }),
    E(50.2, "phase_ended", { phase: "commit_implement", status: "ok" }),
    code(50.3, "changes", "git", "Diff the whole run against its pinned baseline, for the documenter."),
    E(50.4, "phase_ended", { phase: "changes", status: "ok" }),
    agent(50.5, "document", "documenter", "claude-sonnet-5", "document", "Write up the completed change, from the diff, for the people who maintain it."),
    ...tools(50.5, 52.8, "document", 11),
    E(52.9, "envelope_accepted", { phase: "document", owner: "documenter", type: "DocumentOutput", attempt: 1, payload: { document_path: doc } }),
    E(52.9, "artifact_written", { phase: "document", path: doc, where: "tree", role: "output", bytes: 3479, digest: "c7d2…", same_as_handoff: "document.md" }),
    E(52.9, "usage", { phase: "document", owner: "documenter", input: 120000, output: 3000, cache_read: 90000, cost: 0.18, context: [44000, 200000] }),
    E(52.9, "phase_ended", { phase: "document", status: "ok" }),

    return `<div class="lane"><div class="who">${o}${any.pkind === "agent" ? `<small>${any.model}</small>` : ""}</div><div class="track">${mine.map(p => {
      const end = p.end || nowTs(), w = Math.max(x(end) - x(p.start), 0.8);
      const ticks = p.events.filter(e => ["tool_called", "envelope_rejected", "gate_result", "command_finished"].includes(e.kind))
        .map(e => `<span class="tick ${e.ok === false || e.exit || e.kind === "envelope_rejected" ? "bad" : ""}" style="left:${((x(e.ts) - x(p.start)) / w) * 100}%"></span>`).join("");
      return `<div class="blk ${{ ok: "ok", failed: "bad", waiting: "wait" }[p.status] || ""} ${sel === p.id ? "sel" : ""}" style="left:${x(p.start)}%;width:${w}%" onclick="pick(${p.id})" title="${p.phase}">${GLYPH[p.status]} ${p.phase}${ticks}</div>`;
    }).join("")}</div></div>`;
  }).join("");
  const p = ps.find(p => p.id === sel);
  return `<div class="A ${p ? "" : "closed"}"><div class="wf"><div class="axis"><span>${fmt(s.start.ts)}</span><span>${fmt(new Date(t1).toISOString())}</span></div>${rows}
      <p class="mute" style="font-size:12.5px">Ticks are tool calls (now a core event), gates and commands. Three chapters and an hour-long gate wait share one axis.</p></div>
    ${p ? `<div class="panel"><div style="display:flex;justify-content:space-between"><b>${GLYPH[p.status]} ${p.phase}</b><button onclick="pick(null)">×</button></div>
      <div class="mute" style="font-size:12.5px">${pMeta(p)} · ${chapterName(p.chapter)}</div><p>${esc(p.description)}</p>${phaseTabs(p, tab, k => `setTab('${k}')`)}</div>` : ""}</div>`;
}

// ─────────────────────────── B: stepper ───────────────────────────
function B() {
  const ps = phases();
  if (sel === null || !ps.find(p => p.id === sel)) sel = (ps.find(p => ["running", "waiting", "failed"].includes(p.status)) || ps[ps.length - 1]).id;
  const p = ps.find(p => p.id === sel);
  let chap = null;
  const steps = ps.map(x => {
    const head = x.chapter !== chap ? (chap = x.chapter, `<div class="chap">${chapterName(chap)}</div>`) : "";
    const u = x.events.filter(e => e.kind === "usage").reduce((a, e) => a + e.cost, 0);
    return `${head}<div class="step ${x.id === sel ? "sel" : ""}" onclick="pick(${x.id})"><span class="g">${GLYPH[x.status]}</span>
      <div>${x.phase}<small>${x.pkind === "agent" ? x.owner : x.pkind === "human" ? "a person decides" : "code"}${u ? ` · $${u.toFixed(2)}` : ""}${x.replayed ? " · replayed" : ""}</small></div><small>${x.end ? mins((Date.parse(x.end) - Date.parse(x.start)) / 60000) : "…"}</small></div>`;
  }).join("");
  return `<div class="B"><div class="steps">${steps}</div><div class="body"><h2 style="margin:0">${GLYPH[p.status]} ${p.phase}</h2>
    <div class="mute">${pMeta(p)} · ${esc(p.description)}</div>${p.error ? `<p class="tag bad">${esc(p.error)}</p>` : ""}${phaseTabs(p, tab, k => `setTab('${k}')`)}</div></div>`;
}

// ─────────────────────────── C and D: the story, in chapters ───────────────────────────
function C(tabbed = false) {
  const ps = phases(), s = summary(), w = s.waiting && s.waiting.waiting_for, last = ps[ps.length - 1];
  const headline = s.status === "waiting" ? `Waiting on a person: <b>${w.gate} gate, round ${w.round}</b>, asked on issue #${w.issue_number}.`
    : s.status === "running" ? `Running: <b>${last.owner}</b> is on <b>${last.phase}</b> in ${chapterName(s.chapter)}.`
    : s.status === "failed" ? `Failed in <b>${last.phase}</b> (${chapterName(s.chapter)}): ${esc(last.error)}.`
    : `Done: all work went into one PR, <a href="#">#${PR}</a>, over ${events().filter(e => e.kind === "workflow_started").length} chapters.`;
  const items = [];   // [seq, html], sorted into time order at the end
  for (const e of events()) {
    if (e.kind === "workflow_started") items.push([e.seq, `<div class="chapter"><h2>${chapterName(e)}</h2><span>${e.trigger === "pr" ? `started by ${e.by}'s review on PR #${e.work.n}` : `started by ${e.by} labelling issue #${e.work.n}`} · ${fmt(e.ts)}</span></div>`]);
    if (e.kind === "session_resumed") {
      const rep = events().filter(r => r.kind === "phase_replayed").map(r => r.phase);
      items.push([e.seq, `<div class="beat quiet"><b>▶ resumed</b> by the ${e.by} · ${fmt(e.ts)} · ${rep.join(" and ")} replayed from their recorded envelopes, not rerun</div>`]);
    }
  }
  for (const p of ps) {
    const arts = artifactsOf(p), req = arts.find(a => a.role === "request");
    if (req) {   // the phase that reads the request becomes the chapter's "asked" block
      items.push([p.seq, `<div class="asked"><div class="mute" style="font-size:12px">ASKED · ${req.name} · ${(req.bytes / 1024).toFixed(1)} KB</div>
        <details ${p.chapter.workflow === "pr-review" ? "open" : ""}><summary>${p.chapter.workflow === "pr-review" ? "the reviewers' threads" : "the issue as reported, and the requirements agreed on it"}</summary><div class="md">${md(req.body)}</div></details></div>`]);
      continue;
    }
    if (p.pkind === "human") {
      for (const e of p.events) {
        if (e.kind === "committed") items.push([e.seq, `<div class="beat quiet">⎇ committed the subject as <span class="mono">${e.sha}</span> and pushed it, so the gate can be judged on GitHub</div>`]);
        if (e.kind === "suspended") items.push([e.seq, `<div class="beat human ${s.waiting && s.waiting.seq === e.seq ? "run" : ""}"><div class="card"><h3>⏸ Asked: ${e.waiting_for.gate} gate, round ${e.waiting_for.round}</h3>
          <div class="t">${fmt(e.ts)} · on issue #${e.waiting_for.issue_number} · <a href="#">the plan at ${e.head_sha} ↗</a></div></div></div>`]);
        if (e.kind === "decision_recorded") items.push([e.seq, `<div class="beat ${e.verdict === "approve" ? "ok" : "bad"}"><h3>${e.by} ${e.verdict === "approve" ? "approved" : "rejected"}</h3>
          <div class="t">${fmt(e.ts)} · via ${e.channel}</div>${e.notes ? `<div class="note">✎ "${esc(e.notes)}"</div>` : ""}</div>`]);
      }
      continue;
    }
    const d = p.end ? mins((Date.parse(p.end) - Date.parse(p.start)) / 60000) : "";
    const cls = p.status === "running" ? "run" : p.status === "ok" ? "ok" : p.status === "failed" ? "bad" : "";
    let what = "";
    if (p.pkind === "agent") {
      const acc = p.events.find(e => e.kind === "envelope_accepted"), rej = p.events.filter(e => e.kind === "envelope_rejected");
      const n = p.events.filter(e => e.kind === "tool_called").length;
      what = acc ? `${p.owner} reported <b>${acc.type}</b>${rej.length ? ` after ${rej.length} correction (${rej.map(r => esc(r.reason)).join("; ")})` : ""}${acc.payload.summary ? `: ${esc(acc.payload.summary)}` : ""}`
                 : `${p.owner} is working`;
      what += ` <span class="mute" style="font-size:12.5px">· ${n} tool calls</span>`;
      if (acc && acc.payload.changed_files) what += `<div class="mute mono" style="font-size:12px">changed ${acc.payload.changed_files.join(", ")}</div>`;
      if (!acc && transcripts) what += `<pre>${esc(p.events.filter(e => e.kind === "harness_output").slice(-3).map(e => e.chunk).join("\n"))}</pre>`;
    } else {
      const c = p.events.filter(e => e.kind === "command_finished"), k = p.events.find(e => e.kind === "committed");
      what = c.map(e => `<span class="tag ${e.exit ? "bad" : "ok"}">${e.exit ? "✕" : "✓"}</span> <span class="mono">${esc(e.argv.join(" "))}</span>`).join(" ");
      const bad = c.filter(e => e.exit); if (bad.length) what += `<pre>${esc(bad[bad.length - 1].tail)}</pre>`;
      if (k) what += `⎇ committed <span class="mono">${k.sha}</span>${k.pushed ? " and pushed" : ""}: ${esc(k.message)}`;
      if (p.phase === "changes") what = `diffed the run against ${BASE}: <a href="#">compare ${BASE}…a1b2c3d on GitHub ↗</a>`;
    }
    const chips = arts.map(a => `<a href="#" class="tag" style="text-decoration:none" onclick="${tabbed ? `openArt(${p.id})` : ""};return false">📄 ${esc(a.name)}</a>`).join(" ");
    const auto = p.events.filter(e => e.kind === "decision_recorded" && e.by === "policy").map(e => `<div class="mute" style="font-size:13px">⚙ ${e.gate} gate approved by policy (automatic, nobody was asked)</div>`).join("");
    const notes = pJournal(p);
    items.push([p.seq, `<div class="beat ${cls}"><h3>${p.phase}${p.replayed ? ` <span class="tag">replayed on resume</span>` : ""}</h3>
      <div class="t">${fmt(p.start)}${d ? ` · ${d}` : ""} · ${pMeta(p)}</div><div>${what}</div>${chips ? `<div style="margin-top:4px">${chips}</div>` : ""}${notes ? `<div style="margin-top:4px">${notes}</div>` : ""}${auto}
      ${tabbed ? `<div class="more"><a href="#" onclick="togglePh(${p.id});return false">${openPh.has(p.id) ? "▾" : "▸"} everything about this phase</a>
          ${openPh.has(p.id) ? phaseTabs(p, tabOf[p.id] || (arts.length ? "artifacts" : p.pkind === "code" ? "checks" : "overview"), k => `tabPh(${p.id},'${k}')`) : ""}</div>`
        : `<details><summary>everything about this phase</summary>${pArtifacts(p)}${pEnvelopes(p)}${pChecks(p)}${pTools(p)}${pUsage(p)}</details>`}</div>`]);
  }
  items.sort((a, b) => a[0] - b[0]);
  return `<div class="C ${tabbed ? "D" : ""}">
    <div class="now"><div class="mute" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em">now</div><div class="big">${headline}</div>
      <div class="mute" style="font-size:13px">$${s.cost.toFixed(2)} so far · <a href="#" onclick="showJournal=!showJournal;render();return false">${showJournal ? "hide" : "show"} the journal</a> (what the next agent reads)</div>
      ${showJournal ? `<div style="margin-top:10px;font-size:13px;border-top:1px solid var(--line);padding-top:8px">${journal()}</div>` : ""}</div>
    ${items.map(i => i[1]).join("")}
    ${s.status === "running" ? `<div class="beat run"><h3 class="mute">…live, updating as events arrive</h3></div>` : ""}</div>`;
}
const D = () => C(true);

// ─────────────────────────── wiring ───────────────────────────
function pick(id) { sel = sel === id && variant === "A" ? null : id; render(); }
function setTab(t) { tab = t; render(); }
function togglePh(id) { openPh.has(id) ? openPh.delete(id) : openPh.add(id); render(); }
function tabPh(id, k) { tabOf[id] = k; render(); }
function openArt(id) { openPh.add(id); tabOf[id] = "artifacts"; render(); }
function render() {
  head();
  document.getElementById("app").innerHTML = { A, B, C, D }[variant]();
  document.getElementById("label").textContent = `${variant} (${VARIANTS[variant]})`;
  document.getElementById("scen").value = scen;
  document.getElementById("tr").checked = transcripts;
}
function go(v) {
  variant = v;
  const u = new URL(location); u.searchParams.set("variant", v); u.searchParams.set("s", scen); u.searchParams.set("t", transcripts ? "1" : "0");
  history.replaceState(null, "", u); render();
}
const keys = Object.keys(VARIANTS);
document.getElementById("prev").onclick = () => go(keys[(keys.indexOf(variant) + keys.length - 1) % keys.length]);
document.getElementById("next").onclick = () => go(keys[(keys.indexOf(variant) + 1) % keys.length]);
document.getElementById("scen").onchange = e => { scen = e.target.value; sel = null; openPh.clear(); load(); go(variant); };
document.getElementById("tr").onchange = e => { transcripts = e.target.checked; load(); go(variant); };
addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "ArrowLeft") document.getElementById("prev").click();
  if (e.key === "ArrowRight") document.getElementById("next").click();
});
load(); go(variant);
</script>
</body>
</html>
