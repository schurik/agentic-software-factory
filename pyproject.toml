# Tool configuration for THIS repository — the skill's own development.
#
# Not a package: nothing here is installed, and `skills/agentic-sf/templates/asf/`
# is stamped into other repositories rather than imported from a distribution.
# The file exists so `pytest` and `ruff check` mean the same thing on a laptop
# and in CI, with no arguments to remember.

[tool.pytest.ini_options]
testpaths = ["tests"]
# Failures print the assertion and stop at the tenth — a suite that scrolls off
# the top of a CI log is one nobody reads.
#
# `-n auto` (pytest-xdist) is not in here, though CI and the documented command
# both pass it. It changes how fast the suite runs, never what it tests, and an
# `-n` in addopts would make a plain `pytest` refuse to start on any machine
# without xdist — and with no package to install, every environment here lists
# its test dependencies by hand, so some will leave it out. It would also start
# a worker per core to run one test, and take `--pdb` and `-s` from the run you
# are debugging. The suite is mostly subprocesses (an installer, `asf/asf.py` in
# a stamped repo, `git`) competing for the machine, so `-n auto` roughly halves
# it rather than dividing it by the cores.
addopts = "-q --maxfail=10"
# A deprecation is how the factory finds out it is about to break in someone
# else's repository — pydantic 2.11 deprecating `self.model_fields` was already
# one, and it would have become a hard error on their machine, not ours. So it
# fails the build here instead. A dependency release can therefore turn CI red
# without anything in a pull request changing; that is the warning arriving,
# and the fix belongs in the module the traceback names.
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
# The factory's modules carry long explanatory comments and wide call sites;
# 100 is what the existing code was written to.
line-length = 100
extend-exclude = ["apps"]   # the cockpit is TypeScript

[tool.ruff.lint]
# Pyflakes plus the pycodestyle errors that are real bugs (E4 imports,
# E7 statements, E9 syntax) — ruff's default set. Deliberately not widened in
# the same change that introduces CI: a lint storm on day one is a lint that
# gets turned off on day two.
select = ["E4", "E7", "E9", "F"]
