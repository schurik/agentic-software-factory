<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" role="img" aria-labelledby="t d">
<title id="t">Components of a stamped factory and its local cockpit</title>
<desc id="d">Left, the stamped repository as a station: watchers start session processes, which append events to the session directory; the station loop ships them to the Convex backend's site on port 3211, and a cockpit child starts the Docker project. Right, the Docker project asf-cockpit holds the Next.js app on port 3000, which deploys functions to the backend API on port 3210, and the Convex backend with its site and API ports and its volumes. The browser loads pages from the app and subscribes to live queries on the backend API.</desc>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.station rect { fill: #EEEDFE; stroke: #534AB7; }
.station .th { fill: #3C3489; }
.station .ts { fill: #534AB7; }
.cockpit rect { fill: #E1F5EE; stroke: #0F6E56; }
.cockpit .th { fill: #085041; }
.cockpit .ts { fill: #0F6E56; }
.box { fill: #F1EFE8; stroke: #888780; }
.frame { fill: none; stroke: #888780; stroke-dasharray: 4 4; }
.arr { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="589" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>

<rect class="frame" x="40" y="40" width="240" height="520" rx="16" stroke-width="0.5"/>
<text class="th" x="56" y="64" dominant-baseline="central">Stamped repo (station)</text>
<text class="ts" x="56" y="82" dominant-baseline="central">your checkout, asf/</text>

<g class="station">
<rect x="56" y="100" width="208" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="160" y="118" text-anchor="middle" dominant-baseline="central">Watchers</text>
<text class="ts" x="160" y="138" text-anchor="middle" dominant-baseline="central">issues · answers · prs</text>
<rect x="56" y="196" width="208" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="160" y="214" text-anchor="middle" dominant-baseline="central">Session process</text>
<text class="ts" x="160" y="234" text-anchor="middle" dominant-baseline="central">asf run, one session</text>
<rect x="56" y="292" width="208" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="160" y="310" text-anchor="middle" dominant-baseline="central">Session directory</text>
<text class="ts" x="160" y="330" text-anchor="middle" dominant-baseline="central">events.jsonl · shipped.json</text>
<rect x="56" y="388" width="208" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="160" y="406" text-anchor="middle" dominant-baseline="central">Station loop</text>
<text class="ts" x="160" y="426" text-anchor="middle" dominant-baseline="central">ships past acked seq</text>
<rect x="56" y="484" width="208" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="160" y="502" text-anchor="middle" dominant-baseline="central">Cockpit child</text>
<text class="ts" x="160" y="522" text-anchor="middle" dominant-baseline="central">docker compose up</text>
</g>
<line x1="160" y1="156" x2="160" y2="194" class="arr" marker-end="url(#arrow)"/>
<line x1="160" y1="252" x2="160" y2="290" class="arr" marker-end="url(#arrow)"/>
<line x1="160" y1="348" x2="160" y2="386" class="arr" marker-end="url(#arrow)"/>

<rect class="box" x="380" y="40" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="490" y="58" text-anchor="middle" dominant-baseline="central">Browser</text>
<text class="ts" x="490" y="78" text-anchor="middle" dominant-baseline="central">you, at localhost:3000</text>

<rect class="frame" x="310" y="130" width="330" height="430" rx="16" stroke-width="0.5"/>
<text class="th" x="326" y="154" dominant-baseline="central">Docker project asf-cockpit</text>
<text class="ts" x="326" y="172" dominant-baseline="central">published ghcr.io images</text>

<g class="cockpit">
<rect x="330" y="196" width="290" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="475" y="214" text-anchor="middle" dominant-baseline="central">Next.js app :3000</text>
<text class="ts" x="475" y="234" text-anchor="middle" dominant-baseline="central">serves pages, deploys functions</text>
<rect x="330" y="292" width="290" height="140" rx="12" stroke-width="0.5"/>
<text class="th" x="346" y="314" dominant-baseline="central">Convex backend</text>
<text class="ts" x="346" y="332" dominant-baseline="central">stores every event</text>
</g>
<rect class="box" x="346" y="356" width="126" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="409" y="374" text-anchor="middle" dominant-baseline="central">Site :3211</text>
<text class="ts" x="409" y="394" text-anchor="middle" dominant-baseline="central">POST /ingest</text>
<rect class="box" x="486" y="356" width="118" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="545" y="374" text-anchor="middle" dominant-baseline="central">API :3210</text>
<text class="ts" x="545" y="394" text-anchor="middle" dominant-baseline="central">live queries</text>

<rect class="box" x="330" y="476" width="290" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="475" y="494" text-anchor="middle" dominant-baseline="central">Volumes: data, keys</text>
<text class="ts" x="475" y="514" text-anchor="middle" dominant-baseline="central">SQLite, tokens, admin key</text>

<line x1="560" y1="96" x2="560" y2="194" class="arr" marker-end="url(#arrow)"/>
<path d="M600 68 L630 68 L630 384 L606 384" class="arr" marker-end="url(#arrow)"/>
<line x1="545" y1="252" x2="545" y2="354" class="arr" marker-end="url(#arrow)"/>
<line x1="264" y1="400" x2="344" y2="400" class="arr" marker-end="url(#arrow)"/>
<line x1="475" y1="432" x2="475" y2="474" class="arr" marker-end="url(#arrow)"/>
<line x1="264" y1="512" x2="308" y2="512" class="arr" marker-end="url(#arrow)"/>
</svg>
