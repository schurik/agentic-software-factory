<svg xmlns="http://www.w3.org/2000/svg" width="680" height="630" viewBox="0 0 680 630" role="img" aria-labelledby="t d">
<title id="t">Data flow between a stamped factory and its local cockpit</title>
<desc id="d">A sequence across five lanes: session directory, station loop, Next.js app, Convex backend and browser. At start-up the app deploys functions to the backend; the station loop asks the app for an ingest token with docker compose exec, the app issues it through the backend and returns it. The browser gets the page from the app on port 3000 and subscribes to live queries on the backend's port 3210. For each new event, the session's events file grows, the loop posts the lines past the acknowledged seq to the backend's site on port 3211, the backend answers with the acked seq, the loop writes shipped.json, and the backend pushes a live update to the browser.</desc>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.band { font-size: 12px; fill: #888780; }
.station rect { fill: #EEEDFE; stroke: #534AB7; }
.station .th { fill: #3C3489; }
.cockpit rect { fill: #E1F5EE; stroke: #0F6E56; }
.cockpit .th { fill: #085041; }
.box { fill: #F1EFE8; stroke: #888780; }
.arr { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
.reply { stroke-dasharray: 4 3; }
.life { stroke: #B4B2A9; stroke-width: 0.5; stroke-dasharray: 3 3; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="629" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>

<g class="station">
<rect x="44" y="40" width="112" height="44" rx="8" stroke-width="0.5"/><text class="th" x="100" y="62" text-anchor="middle" dominant-baseline="central">Session dir</text>
<rect x="170" y="40" width="120" height="44" rx="8" stroke-width="0.5"/><text class="th" x="230" y="62" text-anchor="middle" dominant-baseline="central">Station loop</text>
</g>
<g class="cockpit">
<rect x="304" y="40" width="112" height="44" rx="8" stroke-width="0.5"/><text class="th" x="360" y="62" text-anchor="middle" dominant-baseline="central">Next.js app</text>
<rect x="450" y="40" width="80" height="44" rx="8" stroke-width="0.5"/><text class="th" x="490" y="62" text-anchor="middle" dominant-baseline="central">Backend</text>
</g>
<rect class="box" x="560" y="40" width="80" height="44" rx="8" stroke-width="0.5"/><text class="th" x="600" y="62" text-anchor="middle" dominant-baseline="central">Browser</text>

<line x1="100" y1="84" x2="100" y2="604" class="life"/>
<line x1="230" y1="84" x2="230" y2="604" class="life"/>
<line x1="360" y1="84" x2="360" y2="604" class="life"/>
<line x1="490" y1="84" x2="490" y2="604" class="life"/>
<line x1="600" y1="84" x2="600" y2="604" class="life"/>

<text class="band" x="20" y="116">start-up</text>
<text class="ts" x="425" y="116" text-anchor="middle">deploy functions</text>
<line x1="360" y1="124" x2="488" y2="124" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="295" y="156" text-anchor="middle">exec tokens:issue</text>
<line x1="230" y1="164" x2="358" y2="164" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="425" y="196" text-anchor="middle">issue token</text>
<line x1="360" y1="204" x2="488" y2="204" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="425" y="236" text-anchor="middle">token</text>
<line x1="490" y1="244" x2="362" y2="244" class="arr reply" marker-end="url(#arrow)"/>
<text class="ts" x="295" y="276" text-anchor="middle">token</text>
<line x1="360" y1="284" x2="232" y2="284" class="arr reply" marker-end="url(#arrow)"/>

<line x1="20" y1="304" x2="660" y2="304" class="life"/>

<text class="band" x="20" y="326">page load</text>
<text class="ts" x="545" y="326" text-anchor="middle">GET :3000</text>
<line x1="600" y1="334" x2="362" y2="334" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="545" y="366" text-anchor="middle">subscribe :3210</text>
<line x1="600" y1="374" x2="492" y2="374" class="arr" marker-end="url(#arrow)"/>

<line x1="20" y1="394" x2="660" y2="394" class="life"/>

<text class="band" x="20" y="416">each event</text>
<text class="ts" x="165" y="436" text-anchor="middle">file grew</text>
<line x1="100" y1="444" x2="228" y2="444" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="295" y="470" text-anchor="middle">POST :3211/ingest</text>
<line x1="230" y1="478" x2="488" y2="478" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="425" y="504" text-anchor="middle">acked: n</text>
<line x1="490" y1="512" x2="232" y2="512" class="arr reply" marker-end="url(#arrow)"/>
<text class="ts" x="165" y="538" text-anchor="middle">shipped.json</text>
<line x1="230" y1="546" x2="102" y2="546" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="545" y="572" text-anchor="middle">live update</text>
<line x1="490" y1="580" x2="598" y2="580" class="arr" marker-end="url(#arrow)"/>
</svg>
